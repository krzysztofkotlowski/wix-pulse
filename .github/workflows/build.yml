name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    name: Unit tests (WixPulseCore)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run Swift tests
        working-directory: Sources/WixPulseCore
        run: swift test

  build-app:
    name: Build macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild \
            -project WixPulse.xcodeproj \
            -scheme WixPulse \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
