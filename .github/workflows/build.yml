name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    name: Unit tests (WixPulseCore)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Run Swift tests
        working-directory: Sources/WixPulseCore
        run: swift test

  build-app:
    name: Build macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild \
            -project WixPulse.xcodeproj \
            -scheme WixPulse \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
